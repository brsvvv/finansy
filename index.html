<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f0e0c" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f0e8" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Фінанси">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; -webkit-text-size-adjust: 100%; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<title>Фінанси Ігоря</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: одна мобільна колонка до 520px, картки-секції, нижня навігація-«пігулка» і кнопка «Додати» над нею */
:root {
  --bg: #0f0e0c;          /* графіт з теплим відтінком */
  --surface: #1b1a17;
  --surface-2: #26241f;
  --line: #34312a;
  --fg: #f4f1ea;
  --muted: #a39d90;
  --accent: #e7b54a;      /* шафран */
  --accent-ink: #1d1606;
  --good: #3fbf74;
  --warn: #f0a33a;
  --warn-bg: #3a2c12;
  --scrim: rgba(0,0,0,.55);
  --font-display: "Nunito", ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
  --font-body: "Nunito", ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif;
  --c1:#e7b54a; --c2:#e7704a; --c3:#4aa8e7; --c4:#3fbf9a; --c5:#9a7ee8; --c6:#e75a8c;
  --c7:#7fc24a; --c8:#d98be0; --c9:#5ad1d6; --c10:#e8d14a; --c11:#f08a5d; --c12:#8f8a7e; --c13:#5fd4a8; --c14:#e0864a;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg:#f3f0e8; --surface:#fffdf8; --surface-2:#ece7dc; --line:#ddd6c7; --fg:#1d1b16; --muted:#6d675b;
    --accent:#c98d12; --accent-ink:#fffaf0; --good:#1f8f50; --warn:#b86e05; --warn-bg:#fbedd2; --scrim:rgba(30,25,15,.35);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg:#f3f0e8; --surface:#fffdf8; --surface-2:#ece7dc; --line:#ddd6c7; --fg:#1d1b16; --muted:#6d675b;
  --accent:#c98d12; --accent-ink:#fffaf0; --good:#1f8f50; --warn:#b86e05; --warn-bg:#fbedd2; --scrim:rgba(30,25,15,.35);
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.4; padding-inline: 16px; padding-block: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.app { max-width: 520px; margin: 0 auto; padding-block: 12px 150px; display: grid; gap: 14px; }
.app .app { margin: 0; width: 100%; max-width: none; min-width: 0; }
.app > * { min-width: 0; }
.top-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
.top .menu-btn, .top .top-add, .edge { display: none; }

/* шапка */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 6px; }
.top h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(26px, 8vw, 34px); margin: 0; letter-spacing: -.01em; }
.top-actions { display: flex; gap: 8px; }
.chip-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
.icon-btn { width: 40px; height: 40px; padding: 0; justify-content: center; }
.sample { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.sample.err-line { color: var(--c2); }
.sample.err-line b { background: color-mix(in srgb, var(--c2) 18%, var(--surface-2)); color: var(--c2); }
.sample button { border: 0; background: transparent; color: var(--accent); font: inherit; font-weight: 700; padding: 0 2px; cursor: pointer; }
.sample b { background: var(--surface-2); color: var(--fg); border-radius: 6px; padding: 2px 7px; font-weight: 600; letter-spacing: .02em; }

/* періоди */
.periods { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin-inline: -16px; padding-inline: 16px; }
.periods::-webkit-scrollbar { display: none; }
.periods button { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 9px 16px; font-weight: 600; font-size: 14px; color: var(--muted); }
.periods button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }

/* картки */
.card { background: var(--surface); border-radius: 24px; padding: 18px; display: grid; gap: 12px; }
.card h2 { margin: 0; font-size: 17px; font-weight: 700; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.card h2 small { font-size: 13px; color: var(--muted); font-weight: 500; }

.summary { background: linear-gradient(160deg, var(--surface-2), var(--surface)); }
.summary .label { color: var(--muted); font-size: 14px; font-weight: 500; }
.big { font-family: var(--font-display); font-weight: 800; font-size: clamp(34px, 11vw, 46px); letter-spacing: -.02em; line-height: 1.05; }
.big.neg { color: var(--c2); }
.summary .meta { color: var(--muted); font-size: 14px; display: grid; gap: 2px; }
.rate { display: grid; gap: 6px; }
.rate-bar { height: 6px; border-radius: 6px; background: var(--line); overflow: hidden; }
.rate-bar span { display: block; height: 100%; background: var(--good); border-radius: 6px; }
.review { border: 0; background: var(--warn-bg); color: var(--warn); border-radius: 14px; padding: 12px 14px; font-weight: 600; text-align: left; display: flex; justify-content: space-between; align-items: center; gap: 8px; }

.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface); border-radius: 999px; padding: 4px; gap: 4px; }
.seg button { border: 0; background: transparent; border-radius: 999px; padding: 10px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface-2); color: var(--fg); }

/* категорії */
.card-head { border: 0; background: transparent; padding: 0; width: 100%; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 17px; font-weight: 700; text-align: left; }
.card-head .right { display: inline-flex; align-items: baseline; gap: 10px; }
.card-head small { font-size: 13px; color: var(--muted); font-weight: 500; }
.caret { color: var(--muted); display: inline-block; transition: transform .2s; }
.card-head[aria-expanded="true"] .caret { transform: rotate(180deg); }
#cat-list { display: grid; gap: 4px; }
.stack { display: flex; gap: 3px; height: 12px; border-radius: 8px; overflow: hidden; }
.stack span { min-width: 3px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 6px; }
.chip { border: 0; background: var(--surface-2); border-radius: 999px; padding: 7px 12px; font-size: 13px; font-weight: 600; display: inline-flex; gap: 6px; align-items: center; }
.chip b { color: var(--muted); font-weight: 600; }
.cat-row { border: 0; background: transparent; padding: 4px 0; display: grid; gap: 7px; text-align: left; width: 100%; }
.cat-row .head { display: grid; grid-template-columns: 28px 1fr auto 14px; align-items: center; gap: 8px; }
.cat-row .emo { font-size: 20px; line-height: 1; }
.cat-row .name { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cat-row .sum { font-weight: 700; }
.chev { color: var(--muted); }
.bar { height: 8px; border-radius: 8px; background: var(--surface-2); overflow: hidden; }
.bar span { display: block; height: 100%; border-radius: 8px; min-width: 4px; }
.more { border: 0; background: transparent; color: var(--muted); font-weight: 600; padding: 6px; justify-self: center; display: inline-flex; gap: 6px; align-items: center; }

/* операції */
.ops { display: grid; }
.op { display: grid; grid-template-columns: 46px 1fr auto; gap: 12px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--line); }
.op:last-child { border-bottom: 0; }
.op .tile { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; font-size: 22px; }
.op .txt { min-width: 0; }
.op .t1 { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.op .t2 { color: var(--muted); font-size: 13px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.op .amt { font-weight: 700; text-align: right; }
.op .amt.in { color: var(--good); }
.flag { background: var(--warn-bg); color: var(--warn); font-size: 11px; font-weight: 700; border-radius: 6px; padding: 1px 6px; }
.day { color: var(--muted); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; padding-top: 10px; }
.empty { color: var(--muted); text-align: center; padding: 18px 8px; }

/* аналітика */
.donut-wrap { display: grid; place-items: center; position: relative; }
.donut-wrap svg { width: min(78vw, 280px); height: auto; display: block; }
.donut-center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; pointer-events: none; padding: 0 22%; }
.donut-center .k { color: var(--muted); font-size: 13px; }
.donut-center .v { font-family: var(--font-display); font-weight: 700; font-size: clamp(18px, 6vw, 24px); }
.hint { color: var(--muted); font-size: 13px; text-align: center; }
.legend .head { grid-template-columns: 12px 28px 1fr auto auto; }
.dot { width: 10px; height: 10px; border-radius: 50%; }
.pct { color: var(--muted); font-size: 13px; }
.seg-sector { cursor: pointer; transition: opacity .25s, stroke-width .25s; }
.legend .cat-row { gap: 6px; }
.legend .bar { height: 6px; margin-left: 20px; }
.rv-item { border-bottom: 1px solid var(--line); overflow: hidden; }
.rv-item:last-child { border-bottom: 0; }
.rv-item .op { border-bottom: 0; padding-bottom: 6px; }
.rv-actions { display: flex; gap: 8px; padding: 0 0 12px 58px; flex-wrap: wrap; }
.rv-actions select { flex: 1; min-width: 160px; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); border-radius: 12px; padding: 8px 10px; font: inherit; font-size: 14px; }
.rv-actions .chip { border: 1px solid var(--line); }
.rv-done { text-align: center; padding: 24px 8px; display: grid; gap: 6px; }
.rv-done b { font-size: 17px; }

/* звіти */
.chart svg { width: 100%; height: auto; display: block; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.stat { background: var(--surface-2); border-radius: 16px; padding: 12px 14px; display: grid; gap: 2px; }
.stat .k { color: var(--muted); font-size: 13px; }
.stat .v { font-weight: 700; font-size: 18px; }
.keys { display: flex; gap: 14px; color: var(--muted); font-size: 13px; }
.keys span { display: inline-flex; gap: 6px; align-items: center; }

/* пошук */
.search { display: flex; gap: 8px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 4px 14px; }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--fg); font: inherit; padding: 10px 0; outline: none; }

/* імпорт */
.drop { border: 2px dashed var(--line); border-radius: 20px; padding: 28px 18px; display: grid; gap: 8px; justify-items: center; text-align: center; cursor: pointer; transition: border-color .2s, background .2s; }
.drop:hover, .drop.over { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); }
.drop input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.drop .big-ico { font-size: 34px; }
.drop strong { font-size: 16px; }
.drop span { color: var(--muted); font-size: 13px; max-width: 46ch; }
.link-btn { border: 0; background: transparent; color: var(--accent); font-weight: 700; padding: 6px; }
.imp-list { display: grid; }
.imp-row { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: 6px 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.imp-row:last-child { border-bottom: 0; }
.imp-row input { width: 18px; height: 18px; accent-color: var(--accent); }
.imp-row .t1 { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.imp-row .t2 { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; gap: 6px; align-items: center; }
.imp-row select { grid-column: 2 / -1; width: 100%; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); border-radius: 12px; padding: 8px 10px; font: inherit; font-size: 14px; }
.imp-row .amt { font-weight: 700; text-align: right; }
.imp-row .amt.in { color: var(--good); }
.imp-row.off { opacity: .45; }
.imp-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.imp-actions .save { flex: 1; min-width: 200px; }
.ghost { border: 1px solid var(--line); background: transparent; border-radius: 16px; padding: 14px 18px; font-weight: 700; }

/* нижня частина */
.dock { position: fixed; left: 0; right: 0; bottom: 0; padding: 0 16px calc(14px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 10px; justify-items: center; pointer-events: none; }
.dock > * { pointer-events: auto; }
.add { width: min(100%, 520px); border: 0; background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 15px; font-weight: 700; font-size: 16px; display: flex; justify-content: center; align-items: center; gap: 8px; box-shadow: 0 10px 30px -10px var(--accent); }
.nav { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 5px; box-shadow: 0 10px 30px -12px var(--scrim); }
.nav button { border: 0; background: transparent; border-radius: 999px; padding: 8px 14px; min-width: 0; display: grid; justify-items: center; gap: 2px; font-size: 12px; font-weight: 600; color: var(--muted); }
.nav button[aria-current="page"] { background: var(--surface-2); color: var(--fg); }
.nav svg { width: 22px; height: 22px; }

@media (max-width: 370px) {
  .nav button { padding: 7px 10px; font-size: 11px; }
  .periods button { padding: 8px 13px; }
}
/* планшет: ширше колонка, та сама мобільна навігація */
@media (min-width: 640px) and (max-width: 959px) {
  .app { max-width: 700px; }
  #cat-list.cols { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: 32px; }
  #an-mode .card { grid-template-columns: 280px minmax(0, 1fr); column-gap: 28px; align-items: center; }
  #an-mode .legend { grid-column: 2; grid-row: 1 / span 2; align-self: start; }
  .sheet { top: 0; align-items: center; }
  .sheet-in { border-radius: 26px; width: min(600px, calc(100% - 48px)); }
}

/* телефон і планшет: кругла кнопка «+» праворуч над навігацією */
.dock .add { width: 58px; height: 58px; padding: 0; border-radius: 50%; justify-self: end; transition: transform .18s ease; }
.dock .add svg { width: 26px; height: 26px; }
.dock .add:active { transform: scale(.92); }
.add-label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* редагування */
.op[data-id] { cursor: pointer; border-radius: 12px; transition: background .15s; }
@media (hover: hover) { .op[data-id]:hover { background: color-mix(in srgb, var(--surface-2) 60%, transparent); } }
.op[data-id]:active { background: var(--surface-2); }
.seg3 { grid-template-columns: 1fr 1fr 1fr; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.row2 .field { min-width: 0; }
.meta-line { color: var(--muted); font-size: 13px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.danger { border: 0; background: color-mix(in srgb, var(--c2) 14%, var(--surface-2)); color: var(--c2); border-radius: 16px; padding: 14px; font-weight: 700; font-size: 15px; transition: background .2s; }
.danger.armed { background: var(--c2); color: var(--accent-ink); }
.danger:disabled { opacity: .6; }

/* шторка */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 10; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 11; display: grid; justify-items: center; }
.sheet-in { width: min(100%, 560px); max-height: 88vh; overflow-y: auto; background: var(--surface); border-radius: 26px 26px 0 0; padding: 10px 18px calc(22px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; }
.grab { width: 40px; height: 5px; border-radius: 5px; background: var(--line); justify-self: center; }
.sheet h3 { margin: 0; font-size: 19px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.x { border: 0; background: var(--surface-2); width: 34px; height: 34px; border-radius: 50%; }
.field { display: grid; gap: 6px; }
.field > span { color: var(--muted); font-size: 13px; font-weight: 600; }
.field input { width: 100%; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); border-radius: 14px; padding: 12px 14px; font: inherit; }
#f-amount { font-family: var(--font-display); font-size: 26px; font-weight: 700; }
.cats { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.cats button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 14px; padding: 10px 6px; display: grid; justify-items: center; gap: 4px; font-size: 12px; font-weight: 600; text-align: center; }
.cats button span { font-size: 22px; }
.cats button[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.save { border: 0; background: var(--accent); color: var(--accent-ink); border-radius: 16px; padding: 15px; font-weight: 700; font-size: 16px; }
.hint a { color: var(--accent); }
.g-btn { display: flex; align-items: center; justify-content: center; gap: 10px; }
.g-btn svg { background: #fff; border-radius: 50%; padding: 3px; box-sizing: content-box; }
.save:disabled { opacity: .45; cursor: not-allowed; }
.err { color: var(--c2); font-size: 13px; }

.toast { position: fixed; left: 50%; bottom: calc(150px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-weight: 600; font-size: 14px; z-index: 20; max-width: calc(100% - 32px); text-align: center; }

/* ===== Комп'ютер: бокове меню + дві колонки ===== */
@media (hover: hover) {
  .cat-row:hover .name, .op:hover .t1 { color: var(--accent); }
  .nav button:hover, .periods button:hover { color: var(--fg); }
  .add:hover, .save:hover { filter: brightness(1.06); }
}
@media (min-width: 960px) {
  body { padding-inline: 0; }
  .app { max-width: none; }
  #app { margin: 0 auto; max-width: 1180px; padding: 28px 48px 56px; gap: 18px; }
  .top .menu-btn, .top .top-add { display: inline-flex; }
  .top-add { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .top h1 { font-size: 32px; }
  .periods { margin-inline: 0; padding-inline: 0; flex-wrap: wrap; overflow: visible; }

  .dock { left: 0; right: auto; top: 0; bottom: 0; width: 248px; padding: 28px 18px; pointer-events: auto;
          display: flex; flex-direction: column; align-items: stretch; justify-content: flex-start; gap: 22px;
          background: var(--surface); border-right: 1px solid var(--line); z-index: 6;
          transform: translateX(-100%); transition: transform .3s cubic-bezier(.2,.8,.2,1), box-shadow .3s; }
  .edge { display: block; position: fixed; left: 0; top: 0; bottom: 0; width: 18px; z-index: 5; }
  .edge::after { content: ""; position: absolute; left: 5px; top: 50%; width: 4px; height: 56px; margin-top: -28px; border-radius: 4px; background: var(--line); transition: background .2s; }
  .edge:hover::after { background: var(--accent); }
  .edge:hover + .dock, .dock:hover, .dock:focus-within, .dock.pinned { transform: none; box-shadow: 0 0 80px -10px var(--scrim); }
  .dock .add { display: none; }
  .dock::before { content: "Фінанси"; order: -2; font-family: var(--font-display); font-weight: 800; font-size: 24px; padding: 2px 12px; }
  .nav { order: -1; flex-direction: column; background: transparent; border: 0; box-shadow: none; padding: 0; gap: 4px; }
  .nav button { display: flex; align-items: center; gap: 12px; padding: 12px 14px; font-size: 15px; border-radius: 14px; }
  .add { width: 100%; box-shadow: none; padding: 14px; font-size: 15px; }

  .summary { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: 32px; align-items: end; padding: 24px 28px; }
  .summary > .label, .summary > .big, .summary > .meta { grid-column: 1; }
  .summary > .rate, .summary > .review { grid-column: 2; }
  .summary > .rate { grid-row: 2; }
  .summary > .review { grid-row: 3; }

<script>
/* ===== Категорії: назва в таблиці → як показуємо ===== */
const CATS = {
  'Продукты':             { uk: 'Продукти', emoji: '🛒', color: 'var(--c7)' },
  'Рестораны и доставка': { uk: 'Ресторани та доставка', emoji: '🍔', color: 'var(--c11)' },
  'Квартира':             { uk: 'Квартира', emoji: '🏠', color: 'var(--c4)' },
  'Транспорт':            { uk: 'Транспорт', emoji: '🚗', color: 'var(--c3)' },
  'Дом':                  { uk: 'Дім', emoji: '🛋️', color: 'var(--c10)' },
  'Здоровье':             { uk: "Здоров'я", emoji: '💊', color: 'var(--c6)' },
  'Подписки':             { uk: 'Підписки', emoji: '🔄', color: 'var(--c5)' },
  'Одежда':               { uk: 'Одяг', emoji: '👕', color: 'var(--c8)' },
  'Электроника':          { uk: 'Електроніка', emoji: '💻', color: 'var(--c9)' },
  'Подарки':              { uk: 'Подарунки', emoji: '🎁', color: 'var(--c1)' },
  'Развлечения':          { uk: 'Розваги', emoji: '🎉', color: 'var(--c2)' },
  'Кредиты':              { uk: 'Кредити', emoji: '💳', color: 'var(--c14)' },
  'Сбережения':           { uk: 'Заощадження', emoji: '💰', color: 'var(--c13)' },
  'Прочее':               { uk: 'Інше', emoji: '📦', color: 'var(--c12)' },
  'Доходы':               { uk: 'Доходи', emoji: '💼', color: 'var(--good)' },
};
const catOf = c => CATS[c] || CATS['Прочее'];

/* ===== Дані =====
   Режим «google» (для всіх): вхід через Google, застосунок створює таблицю «Фінанси» у Google Drive користувача
   і працює лише з нею (дозвіл drive.file — інших файлів не бачить).
   Режим «script» (розширено): своя таблиця через Apps Script (адреса + ключ). */
const GOOGLE_CLIENT_ID = '1043168494723-oj0cehsegrq18eqj5mct9qvb56ui3i9u.apps.googleusercontent.com'; // проєкт Google Cloud «Finansy»
const SHEET_TITLE = 'Фінанси';
const OPS_TAB = 'Операції';
const HEAD = ['ID', 'Дата', 'Тип', 'Категорія', 'Підкатегорія', 'Опис', 'Сума', 'Джерело', 'Перевірити', 'Примітка'];
let TODAY = new Date();
const ymd = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const fromYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const toOp = o => ({ ...o, date: fromYmd(o.date) });
const rid = () => Array.from(crypto.getRandomValues(new Uint8Array(12)), b => b.toString(16).padStart(2, '0')).join('');
async function sha(s) { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return Array.from(new Uint8Array(b).slice(0, 8), x => x.toString(16).padStart(2, '0')).join(''); }

/* Назви в таблиці користувача — українською; всередині застосунку — ключі CATS */
const typeFrom = v => { v = String(v || '').trim(); for (const [k, u] of Object.entries(TYPE_UK)) if (v === k || v === u) return k; return 'Расход'; };
const catFrom = v => { v = String(v || '').trim().replace(/^\p{Extended_Pictographic}️?\s*/u, ''); if (CATS[v]) return v; for (const [k, c] of Object.entries(CATS)) if (c.uk.toLowerCase() === v.toLowerCase()) return k; return 'Прочее'; };
const serialToYmd = n => { const d = new Date(Math.round((n - 25569) * 864e5)); return d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2, '0') + '-' + String(d.getUTCDate()).padStart(2, '0'); };
const ymdToSerial = s => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d) / 864e5 + 25569; };
function cellDate(v) {
  if (typeof v === 'number' && v > 20000) return serialToYmd(v);
  const s = String(v || '').trim(); let m = s.match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})/);
  if (m) return m[3] + '-' + m[2].padStart(2, '0') + '-' + m[1].padStart(2, '0');
  m = s.match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? m[0] : null;
}
function cellAmount(v) {
  if (typeof v === 'number') return v ? Math.abs(v) : null;
  const n = toAmount(v); return n ? Math.abs(n) : null;
}

/* --- Вхід через Google (OAuth 2.0 для браузера, через перенаправлення — працює і з початкового екрана iPhone) --- */
const auth = {
  token() { const t = store.get('g.token', ''), exp = +store.get('g.exp', 0); return t && exp - Date.now() > 60e3 ? t : ''; },
  email() { return store.get('g.email', ''); },
  redirectUri() { return new URL('./', location.href).href; },
  go(silent) {
    const state = rid(); store.set('g.state', state); store.set('g.tried', String(Date.now()));
    const p = new URLSearchParams({
      client_id: GOOGLE_CLIENT_ID, redirect_uri: this.redirectUri(), response_type: 'token', state,
      scope: 'https://www.googleapis.com/auth/drive.file openid email', include_granted_scopes: 'true',
    });
    if (silent) { p.set('prompt', 'none'); if (this.email()) p.set('login_hint', this.email()); }
    else p.set('prompt', 'select_account');
    location.assign('https://accounts.google.com/o/oauth2/v2/auth?' + p);
  },
  /* Розбирає відповідь Google у #… після повернення. 'ok' | 'need-login' | 'denied' | null */
  takeRedirect() {
    if (!/[#&](access_token|error)=/.test(location.hash)) return null;
    const p = new URLSearchParams(location.hash.slice(1));
    history.replaceState(null, '', location.pathname + location.search);
    if (p.get('state') !== store.get('g.state', '-')) return 'denied';
    store.del('g.state');
    if (p.get('access_token')) {
      if (!/drive\.file/.test(p.get('scope') || '')) return 'no-scope';
      store.set('g.token', p.get('access_token')); store.set('g.exp', String(Date.now() + (+p.get('expires_in') || 3600) * 1e3));
      return 'ok';
    }
    return /interaction_required|login_required|consent_required|account_selection_required/.test(p.get('error')) ? 'need-login' : 'denied';
  },
  signOut() {
    const t = store.get('g.token', '');
    if (t) fetch('https://oauth2.googleapis.com/revoke?token=' + encodeURIComponent(t), { method: 'POST' }).catch(() => {});
    ['g.token', 'g.exp', 'g.email', 'g.sheet', 'ops', 'backend'].forEach(k => store.del(k));
  },
};
class AuthExpired extends Error {}
async function gfetch(url, opt = {}) {
  const t = auth.token(); if (!t) throw new AuthExpired('Потрібно увійти знову');
  let res;
  try { res = await fetch(url, { ...opt, headers: { Authorization: 'Bearer ' + t, 'Content-Type': 'application/json', ...(opt.headers || {}) } }); }
  catch (e) { throw new Error('Немає зв\'язку з Google. Перевірте інтернет'); }
  if (res.status === 401) { store.del('g.token'); throw new AuthExpired('Потрібно увійти знову'); }
  const data = res.status === 204 ? {} : await res.json().catch(() => ({}));
  if (!res.ok) {
    if (res.status === 404) throw Object.assign(new Error('Таблицю не знайдено'), { notFound: true });
    if (res.status === 403) throw new Error('Google не дав доступу до таблиці (' + ((data.error && data.error.message) || 'заборонено') + ')');
    throw new Error('Помилка Google: ' + ((data.error && data.error.message) || res.status));
  }
  return data;
}
const SHEETS = 'https://sheets.googleapis.com/v4/spreadsheets/';
const gsheet = {
  id() { return store.get('g.sheet', ''); },
  async me() { const u = await gfetch('https://openidconnect.googleapis.com/v1/userinfo'); if (u.email) store.set('g.email', u.email); return u; },
  /* Знаходить таблицю застосунку в Drive або створює нову */
  async ensure() {
    if (this.id()) return this.id();
    const q = encodeURIComponent("appProperties has { key='finansyApp' and value='1' } and trashed = false");
    const found = await gfetch(`https://www.googleapis.com/drive/v3/files?q=${q}&orderBy=createdTime&fields=files(id,name)&pageSize=5`);
    if (found.files && found.files.length) { store.set('g.sheet', found.files[0].id); return found.files[0].id; }
    const f = await gfetch('https://www.googleapis.com/drive/v3/files?fields=id', { method: 'POST', body: JSON.stringify({ name: SHEET_TITLE, mimeType: 'application/vnd.google-apps.spreadsheet', appProperties: { finansyApp: '1' } }) });
    const meta = await gfetch(SHEETS + f.id + '?fields=sheets.properties');
    const sid = meta.sheets[0].properties.sheetId;
    await gfetch(SHEETS + f.id + ':batchUpdate', { method: 'POST', body: JSON.stringify({ requests: [
      { updateSheetProperties: { properties: { sheetId: sid, title: OPS_TAB, gridProperties: { frozenRowCount: 1 } }, fields: 'title,gridProperties.frozenRowCount' } },
      { updateCells: { range: { sheetId: sid, startRowIndex: 0, endRowIndex: 1, startColumnIndex: 0, endColumnIndex: HEAD.length }, fields: 'userEnteredValue,userEnteredFormat.textFormat.bold',
          rows: [{ values: HEAD.map(h => ({ userEnteredValue: { stringValue: h }, userEnteredFormat: { textFormat: { bold: true } } })) }] } },
      { repeatCell: { range: { sheetId: sid, startRowIndex: 1, startColumnIndex: 1, endColumnIndex: 2 }, cell: { userEnteredFormat: { numberFormat: { type: 'DATE', pattern: 'dd.mm.yyyy' } } }, fields: 'userEnteredFormat.numberFormat' } },
      { repeatCell: { range: { sheetId: sid, startRowIndex: 1, startColumnIndex: 6, endColumnIndex: 7 }, cell: { userEnteredFormat: { numberFormat: { type: 'NUMBER', pattern: '#,##0.00 "zł"' } } }, fields: 'userEnteredFormat.numberFormat' } },
      { setDataValidation: { range: { sheetId: sid, startRowIndex: 1, startColumnIndex: 8, endColumnIndex: 9 }, rule: { condition: { type: 'BOOLEAN' } } } },
      { setDataValidation: { range: { sheetId: sid, startRowIndex: 1, startColumnIndex: 2, endColumnIndex: 3 }, rule: { condition: { type: 'ONE_OF_LIST', values: Object.values(TYPE_UK).map(v => ({ userEnteredValue: v })) }, showCustomUi: true, strict: false } } },
      { setDataValidation: { range: { sheetId: sid, startRowIndex: 1, startColumnIndex: 3, endColumnIndex: 4 }, rule: { condition: { type: 'ONE_OF_LIST', values: Object.values(CATS).map(c => ({ userEnteredValue: c.uk })) }, showCustomUi: true, strict: false } } },
      { autoResizeDimensions: { dimensions: { sheetId: sid, dimension: 'COLUMNS', startIndex: 0, endIndex: HEAD.length } } },
    ] }) });
    store.set('g.sheet', f.id);
    return f.id;
  },
  async call(fn) {
    try { return await fn(await this.ensure()); }
    catch (e) { if (e.notFound) { store.del('g.sheet'); return fn(await this.ensure()); } throw e; }
  },
  rowValues(id, op, source) {
    return [id, ymdToSerial(op.date), TYPE_UK[op.type] || 'Витрата', CATS[op.cat] ? CATS[op.cat].uk : 'Інше', op.sub || '', op.desc || '', op.amount, source, !!op.check, ''];
  },
  async checkRow(id, o) {
    const cur = await gfetch(SHEETS + id + '/values/' + encodeURIComponent(OPS_TAB + '!A' + o.row));
    const curId = String((cur.values && cur.values[0] && cur.values[0][0]) || '') || 'ROW' + o.row;

  async list() {

        { range: OPS_TAB + '!B' + o.row + ':G' + o.row, values: [[ymdToSerial(d.date), TYPE_UK[d.type] || 'Витрата', CATS[d.cat] ? CATS[d.cat].uk : 'Інше', d.sub || '', d.desc || '', d.amount]] },

      await gsheet.checkRow(id, o);

      ] }) });

  },

const api = {
  conf() { return { url: store.get('url', ''), key: store.get('key', '') }; },
  async call(action, body = {}, conf = this.conf()) {

    let res;
    try {
      res = await fetch(conf.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ ...body, action, key: conf.key, request_id: Date.now() + '' + Math.floor(Math.random() * 1000) }) });
    } catch (e) { throw new Error('Немає зв\'язку з таблицею. Перевірте інтернет'); }

    try { data = await res.json(); } catch (e) { throw new Error('Скрипт відповів не так, як очікувалось. Перевірте адресу'); }

function range(p) {

  if (p === 'month') return [new Date(y, m, 1), end];
  if (p === 'prev') return [new Date(y, m - 1, 1), new Date(y, m, 1)];
  if (p === '7d') return [new Date(y, m, TODAY.getDate() - 6), end];

// «Заощадження» — не витрата: рахуємо окремо як «Відклав»
const SAVINGS = 'Сбережения';
function totals(list) {
  let inc = 0, exp = 0, sav = 0;
  list.forEach(o => {
    const v = o.type === 'Возврат' ? -o.amount : o.amount;
    if (o.type === 'Доход') inc += o.amount; else if (o.cat === SAVINGS) sav += v; else exp += v;
  });
  return { inc, exp, sav };
}
function byCat(list, type) {
  const map = {};
  list.forEach(o => {
    const isInc = o.type === 'Доход';
    if (type === 'inc' ? !isInc : isInc) return;
    if (type !== 'inc' && o.cat === SAVINGS) return;
    const key = type === 'inc' ? (o.sub || 'Інше') : o.cat;
    map[key] = (map[key] || 0) + (o.type === 'Возврат' ? -o.amount : o.amount);
  });
  return Object.entries(map).filter(([, v]) => v > 0.004).sort((a, b) => b[1] - a[1]);
}

function renderDonut(list, anim) {
  const data = byCat(list, S.anType);

  const R = 78, C = 2 * Math.PI * R, gap = data.length > 1 ? 2.2 : 0;
  const segs = [];
  let acc = 0;
  $('donut').innerHTML = `<circle cx="100" cy="100" r="${R}" fill="none" stroke="var(--surface-2)" stroke-width="26"/>` + data.map(([n, v], i) => {
    const len = v / total * C, start = acc; acc += len; segs.push([start, Math.max(len - gap, 0.6)]);
    return `<circle class="seg-sector" data-i="${i}" cx="100" cy="100" r="${R}" fill="none" stroke="${donutColor(n)}" stroke-width="26"
      stroke-dasharray="${segs[i][1]} ${C}" stroke-dashoffset="${-start}" transform="rotate(-90 100 100)"><title>${esc(donutLabel(n))}</title></circle>`;
  }).join('');
  S.donut = { data, total };
  $('legend').innerHTML = data.length ? data.map(([n, v], i) => `<button type="button" class="cat-row" data-i="${i}">
      <div class="head"><i class="dot" style="background:${donutColor(n)}"></i><span class="emo">${CATS[n] ? catOf(n).emoji : '💼'}</span><span class="name">${esc(donutLabel(n))}</span><span class="pct num">${Math.round(v / total * 100)}%</span><span class="sum num">${money(v)}</span></div>
      <div class="bar"><span style="width:${(v / data[0][1] * 100).toFixed(1)}%;background:${donutColor(n)}"></span></div></button>`).join('')
    : `<div class="empty">${S.anType === 'inc' ? 'Доходів' : 'Витрат'} за цей період немає</div>`;
  document.querySelectorAll('#donut .seg-sector, #legend .cat-row').forEach(el => el.onclick = () => { const i = +el.dataset.i; selectSector(S.sel === i ? null : i); });
  if (S.sel !== null && S.sel >= data.length) S.sel = null;
  selectSector(S.sel);
  if (anim && data.length && !reduceMotion()) {
    const D = 850;
    $('donut').querySelectorAll('.seg-sector').forEach((c, i) => {
      const [start, full] = segs[i];
      c.animate([{ strokeDasharray: `0 ${C}` }, { strokeDasharray: `${full} ${C}` }],
        { duration: Math.max(full / C * D, 70), delay: start / C * D, easing: 'linear', fill: 'backwards' });
    });
    $('donut').animate([{ transform: 'rotate(-25deg) scale(.94)', opacity: .4 }, { transform: 'none', opacity: 1 }], { duration: D, easing: 'cubic-bezier(.2,.8,.2,1)' });
    if (S.sel === null) countUp($('dc-v'), total, D);

  }
}
const donutColor = n => CATS[n] ? catOf(n).color : 'var(--good)';
const donutLabel = n => CATS[n] ? catOf(n).uk : n;
function selectSector(i) {

  $('donut').querySelectorAll('.seg-sector').forEach(c => { const k = +c.dataset.i; c.style.opacity = i === null || k === i ? 1 : .28; c.style.strokeWidth = k === i ? 33 : 26; });
  $('legend').querySelectorAll('.cat-row').forEach(r => { r.style.opacity = i === null || +r.dataset.i === i ? 1 : .45; r.style.transition = 'opacity .25s'; });
  const s = i !== null && d.data[i];
  $('dc-k').textContent = s ? donutLabel(s[0]) : 'Разом';
  $('dc-v').textContent = money(s ? s[1] : d.total);
}
function countUp(el, to, ms) {
  const t0 = performance.now();
  const step = t => { const k = Math.min(1, (t - t0) / ms), e = 1 - Math.pow(1 - k, 3); el.textContent = money(to * e); if (k < 1) requestAnimationFrame(step); };

}
function stagger(root, sel, every = 35) {

    { duration: 380, delay: Math.min(i, 16) * every, fill: 'backwards', easing: 'cubic-bezier(.2,.8,.2,1)' }));

function renderReports() {
  const y = TODAY.getFullYear();
  $('rep-year').textContent = y + ' рік';
  const months = Array.from({ length: 12 }, (_, m) => totals(S.ops.filter(o => o.date.getFullYear() === y && o.date.getMonth() === m)));
  const max = Math.max(1, ...months.flatMap(t => [t.inc, t.exp]));
  const nice = Math.ceil(max / 1000) * 1000;
  const W = 340, H = 200, L = 34, B = 22, T = 8, cw = (W - L - 4) / 12, bw = cw * 0.32;
  const yy = v => T + (H - T - B) * (1 - v / nice);
  const names = ['січ', 'лют', 'бер', 'кві', 'тра', 'чер', 'лип', 'сер', 'вер', 'жов', 'лис', 'гру'];
  let g = '';
  for (let k = 0; k <= 4; k++) { const v = nice * k / 4, py = yy(v); g += `<line x1="${L}" x2="${W - 2}" y1="${py}" y2="${py}" stroke="var(--line)" stroke-width="1"/><text x="${L - 6}" y="${py + 3}" text-anchor="end" font-size="9" fill="var(--muted)">${v >= 1000 ? (v / 1000).toLocaleString('uk-UA') + 'k' : v}</text>`; }
  months.forEach((t, m) => {
    const x = L + m * cw + cw / 2;
    if (t.exp > 0) g += `<rect x="${x - bw - 1}" y="${yy(t.exp)}" width="${bw}" height="${yy(0) - yy(t.exp)}" rx="2" fill="var(--c2)"><title>${names[m]}: витрати ${money(t.exp)}</title></rect>`;
    if (t.inc > 0) g += `<rect x="${x + 1}" y="${yy(t.inc)}" width="${bw}" height="${yy(0) - yy(t.inc)}" rx="2" fill="var(--good)"><title>${names[m]}: доходи ${money(t.inc)}</title></rect>`;
    g += `<text x="${x}" y="${H - 6}" text-anchor="middle" font-size="9" fill="${m === TODAY.getMonth() ? 'var(--fg)' : 'var(--muted)'}">${names[m]}</text>`;
  });
  $('rep-chart').innerHTML = g;
  const full = months.filter((t, m) => m < TODAY.getMonth() && (t.exp > 0));
  const yt = totals(S.ops.filter(o => o.date.getFullYear() === y));
  const avg = full.length ? full.reduce((s, t) => s + t.exp, 0) / full.length : 0;
  $('rep-stats').innerHTML = [
    ['Витрати за рік', money(yt.exp)], ['Доходи за рік', money(yt.inc)],
    ['Середньо на місяць', full.length ? money(avg) : '—'], ['Заощаджено', money(yt.inc - yt.exp)],
  ].map(([k, v]) => `<div class="stat"><span class="k">${k}</span><span class="v num">${v}</span></div>`).join('');
  const cats = byCat(S.ops.filter(o => o.date.getFullYear() === y), 'exp').slice(0, 6);
  $('rep-cats').innerHTML = cats.map(([n, v], i) => catRowHtml(n, v, cats[0][1], i)).join('') || '<div class="empty">Даних ще немає</div>';
}

let form = {};
const TYPE_UK = { 'Расход': 'Витрата', 'Доход': 'Дохід', 'Возврат': 'Повернення' };
function openAdd() { openEditor(null); }
function openEditor(op) {
  const edit = !!op;

  const amountText = edit ? nf.format(op.amount).replace(/\s/g, '') : '';

  const drawCats = () => {
    const list = form.type === 'Доход' ? [['Доходы', CATS['Доходы']]] : Object.entries(CATS).filter(([k]) => k !== 'Доходы');
    if (form.type === 'Доход') form.cat = 'Доходы'; else if (form.cat === 'Доходы') form.cat = null;

  $('f-save').onclick = async () => {
    const amount = parseFloat($('f-amount').value.replace(/\s/g, '').replace(',', '.'));
    if (!(amount > 0)) return fail('Введіть суму більшу за нуль, наприклад 24,90.');
    if (!form.cat) return fail('Оберіть категорію.');
    if (!/^\d{4}-\d{2}-\d{2}$/.test($('f-date').value)) return fail('Оберіть дату.');
    if (!backend.ready() && !auth.email()) return fail('Спершу увійдіть (⚙ угорі).');

      desc: $('f-desc').value.trim() || catOf(form.cat).uk, amount: Math.round(amount * 100) / 100 };

    try {
      if (edit) {
        await backend.edit(op, data);
        Object.assign(op, toOp(data), { check: false });
      } else {
        S.ops.unshift(toOp(await backend.add(data)));
      }
      S.ops.sort((a, b) => b.date - a.date); cacheOps();
      closeSheet(); render(); renderReports(); if (S.view === 'search') renderSearch();
      toast(edit ? 'Зміни збережено в таблиці' : 'Записано в таблицю');

function matchMerchant(text) {
  const t = ' ' + normTxt(text) + ' ';

  DICT.forEach(([key, name, cat, sub, check]) => {
    const k = normTxt(key);
    for (let i = t.indexOf(k); i > -1; i = t.indexOf(k, i + 1)) {
      if (!/[a-z0-9]/.test(t[i - 1] || ' ') && !/[a-z0-9]/.test(t[i + k.length] || ' ')) {

function csvRows(text) {
  text = text.replace(/^﻿/, '');
  const head = text.split(/\r?\n/).slice(0, 20).join('\n');
  const delim = [';', '\t', ','].map(d => [d, head.split(d).length]).sort((a, b) => b[1] - a[1])[0][0];
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true;
    else if (c === delim) { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;

    const cells = rows[r];
    const f = re => cells.findIndex(c => isH(c, re));
    const date = f(/^(data|date|дата)/), amount = f(/^(kwota|amount|сума|suma)/), debit = f(/obciazen|wydatk|debit/), credit = f(/uznan|wplyw|credit/);
    if (date > -1 && (amount > -1 || debit > -1)) {

    } else {

function categorize(date, amount, raw) {

  const salary = /wynagrodz|pensj|salary|payroll|зарплат/i.test(normTxt(raw));

$('imp-save').onclick = async () => {
  const on = IMP.rows.filter(r => r.on);
  if (!backend.ready() && !auth.email()) { toast('Спершу увійдіть (⚙ угорі)'); return; }
  const btn = $('imp-save'); btn.disabled = true; btn.textContent = 'Записую…';
  try {
    const r = await backend.import( on.map(x => ({ date: ymd(x.date), type: x.type, cat: x.cat, sub: x.sub, desc: x.desc, amount: x.amount, check: x.check, raw: x.raw })));
    r.added.forEach(o => S.ops.push(toOp(o)));
    S.ops.sort((a, b) => b.date - a.date); cacheOps();
    resetImport(); render(); renderReports();
    go('home');
    toast('Записано ' + plural(r.added.length, 'операцію', 'операції', 'операцій') + (r.skipped ? ', пропущено вже наявних: ' + r.skipped : ''));
  } catch (e) { if (handleErr(e)) return; toast(e.message); renderImport(); }
};

matchMedia('(min-width: 960px)').addEventListener('change', () => { S.opsShown = baseShown(); render(); });

(async function start() {
  const t = store.get('theme', ''); if (t) document.documentElement.dataset.theme = t;
  S.period = store.get('period', 'month'); S.mode = store.get('mode', 'list');
  const back = auth.takeRedirect();
  const c = cachedOps(); S.ops = c ? c.ops : [];
  S.anim = true;
  render(); renderReports();
  if (S.mode === 'list') stagger($('list-mode'), '.card, .cat-row, .chip, .day, .op', 30);
  $('set-btn').onclick = openSettings;
  if (backend.mode() === 'script') { if (backend.ready()) refresh(true); else { setStatus('off', 'Ви ще не увійшли'); openWelcome(); } return; }
  if (back === 'ok') { store.del('g.tried'); refresh(true); }
  else if (back === 'need-login') { setStatus('off', 'Потрібно увійти в Google'); openWelcome(); }
  else if (back === 'no-scope') { setStatus('off', 'Немає дозволу на таблицю'); openWelcome('Щоб застосунок працював, на екрані Google дозвольте доступ до файлів, які створює застосунок.'); }
  else if (back === 'denied') { setStatus('off', 'Вхід не завершено'); openWelcome('Вхід не завершено. Спробуйте ще раз.'); }
  else if (auth.token() || auth.email()) refresh(true);
  else { setStatus('off', 'Ви ще не увійшли'); openWelcome(); }
})();
// Повернулись у застосунок — підтягнути нові записи (напр., із шорткату)
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && $('sheet').hidden) refresh(false); });
</script>
